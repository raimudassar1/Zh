<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Georgia',serif;background:#faf8f4;color:#2c2c2a;min-height:100vh}
.app{display:flex;flex-direction:column;min-height:100vh}
.header{background:#2c2c2a;color:#faf8f4;padding:0.85rem 1.25rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.6rem}
.logo{font-size:1.3rem;font-weight:700;letter-spacing:-0.5px;flex-shrink:0}
.logo span{color:#ef9f27}
.header-nav{display:flex;gap:0.4rem;flex-wrap:wrap}
.nav-btn{background:transparent;border:1.5px solid rgba(250,248,244,0.3);color:#faf8f4;padding:0.3rem 0.75rem;border-radius:20px;cursor:pointer;font-size:0.78rem;font-family:inherit;transition:all 0.15s;white-space:nowrap}
.nav-btn:hover,.nav-btn.active{background:#ef9f27;border-color:#ef9f27;color:#2c2c2a;font-weight:600}
.search-bar{padding:0.65rem 1.25rem;background:#fff;border-bottom:1px solid #e8e5df;display:flex;gap:0.6rem;align-items:center}
.search-input{flex:1;padding:0.45rem 0.9rem;border:1.5px solid #d3d1c7;border-radius:20px;font-size:0.88rem;font-family:inherit;outline:none;background:#faf8f4}
.search-input:focus{border-color:#ef9f27;background:#fff}
.search-stats{font-size:0.78rem;color:#888780;white-space:nowrap}
.cat-strip{display:flex;gap:0.4rem;padding:0.6rem 1.25rem;overflow-x:auto;background:#fff;border-bottom:1px solid #e8e5df;scrollbar-width:none}
.cat-strip::-webkit-scrollbar{display:none}
.cat-pill{flex-shrink:0;padding:0.25rem 0.75rem;border-radius:14px;font-size:0.74rem;cursor:pointer;border:1.5px solid #d3d1c7;background:#faf8f4;color:#5f5e5a;font-family:inherit;transition:all 0.15s;white-space:nowrap}
.cat-pill:hover{border-color:#ba7517;color:#ba7517}
.cat-pill.active{background:#faeeda;border-color:#ba7517;color:#854f0b;font-weight:600}
.cards-section{flex:1;padding:1rem 1.25rem}
.cat-title{font-size:1rem;font-weight:700;color:#2c2c2a;margin-bottom:0.85rem;padding-bottom:0.35rem;border-bottom:2px solid #ef9f27;display:inline-block}
.cat-block{margin-bottom:1.75rem}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:0.75rem}
.vcard{background:#fff;border:1px solid #e8e5df;border-radius:12px;overflow:hidden;cursor:pointer;transition:transform 0.12s,box-shadow 0.12s;position:relative}
.vcard:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,0.08)}
.vcard.favorited{border-color:#ef9f27}
.vcard-img{width:100%;aspect-ratio:1;background:#f1efe8;display:flex;align-items:center;justify-content:center;font-size:2.5rem;overflow:hidden}
.vcard-img img{width:100%;height:100%;object-fit:cover}
.vcard-body{padding:0.55rem 0.6rem 0.6rem}
.vcard-zh{font-size:1.15rem;font-weight:700;color:#2c2c2a;line-height:1.2}
.vcard-pinyin{font-size:0.68rem;color:#ba7517;margin:0.08rem 0 0.12rem;font-style:italic}
.vcard-en{font-size:0.68rem;color:#888780}
.vcard-actions{display:flex;gap:0.2rem;position:absolute;top:0.3rem;right:0.3rem}
.icon-btn{background:rgba(255,255,255,0.88);border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.78rem;transition:background 0.12s}
.icon-btn:hover{background:#faeeda}
.icon-btn.fav-on{color:#ef9f27}
.quiz-overlay{position:fixed;inset:0;background:#2c2c2a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:1.5rem}
.quiz-header{position:absolute;top:1rem;left:1rem;right:1rem;display:flex;justify-content:space-between;align-items:center}
.quiz-close{background:transparent;border:1.5px solid rgba(250,248,244,0.3);color:#faf8f4;padding:0.28rem 0.75rem;border-radius:14px;cursor:pointer;font-family:inherit;font-size:0.78rem}
.quiz-progress{color:#888780;font-size:0.82rem}
.quiz-score{color:#ef9f27;font-size:0.82rem;font-weight:600}
.quiz-card{background:#fff;border-radius:16px;max-width:360px;width:100%;overflow:hidden}
.quiz-img{width:100%;aspect-ratio:16/9;background:#f1efe8;display:flex;align-items:center;justify-content:center;font-size:4.5rem;overflow:hidden}
.quiz-img img{width:100%;height:100%;object-fit:cover}
.quiz-body{padding:1.1rem 1.25rem}
.quiz-question{font-size:0.82rem;color:#888780;margin-bottom:0.4rem}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-top:0.85rem}
.quiz-opt{padding:0.6rem 0.4rem;border:1.5px solid #d3d1c7;border-radius:10px;cursor:pointer;font-family:inherit;background:#faf8f4;transition:all 0.12s;text-align:center}
.quiz-opt:hover:not(:disabled){border-color:#ba7517;background:#faeeda}
.quiz-opt.correct{border-color:#639922;background:#eaf3de;color:#3b6d11;font-weight:600}
.quiz-opt.wrong{border-color:#e24b4a;background:#fcebeb;color:#a32d2d}
.quiz-opt .opt-zh{font-size:1.05rem;font-weight:700;display:block}
.quiz-opt .opt-en{font-size:0.66rem;color:#888780;display:block}
.quiz-opt.correct .opt-en,.quiz-opt.wrong .opt-en{color:inherit;opacity:0.7}
.quiz-next{margin-top:0.85rem;width:100%;padding:0.6rem;background:#2c2c2a;color:#faf8f4;border:none;border-radius:10px;font-family:inherit;font-size:0.88rem;cursor:pointer;display:none}
.quiz-next.visible{display:block}
.quiz-result{text-align:center;color:#faf8f4}
.quiz-result h2{font-size:2rem;color:#ef9f27;margin-bottom:0.5rem}
.quiz-result p{color:#b4b2a9;margin-bottom:1.1rem}
.quiz-restart{background:#ef9f27;border:none;color:#2c2c2a;padding:0.6rem 1.6rem;border-radius:20px;font-family:inherit;font-size:0.88rem;font-weight:700;cursor:pointer}
.empty-state{text-align:center;padding:3rem 1rem;color:#888780}
.empty-state .big{font-size:3rem;margin-bottom:0.75rem}
</style>
</head>
<body>
<div class="app" id="app">
<div class="header">
  <div class="logo">學中文 <span>台灣</span></div>

    <button class="nav-btn active" onclick="setMode('browse')" id="btn-browse">瀏覽 Browse</button>
    <button class="nav-btn" onclick="setMode('favorites')" id="btn-fav">⭐ Favorites</button>
    <button class="nav-btn" onclick="startQuiz()" id="btn-quiz">🃏 Quiz</button>
  </div>
</div>
<div class="search-bar">
  <input class="search-input" type="text" id="search" placeholder="Search Chinese, Pinyin, or English…" oninput="handleSearch(this.value)"/>
  <div class="search-stats" id="search-stats"></div>
</div>
<div class="cat-strip" id="cat-strip"></div>
<div class="cards-section" id="cards-section"></div>
<div class="quiz-overlay" id="quiz" style="display:none;"></div>
</div>

const allItems = [];
Object.entries(DATA).forEach(([cat,items])=>items.forEach(item=>allItems.push({...item,cat})));

let currentCat="ALL", searchQuery="", mode="browse";
let favorites=[];
try{favorites=JSON.parse(localStorage.getItem("tcvfavs2")||"[]")}catch(e){}
let imgCache={};

function saveFavs(){try{localStorage.setItem("tcvfavs2",JSON.stringify(favorites))}catch(e){}}
function isFav(zh){return favorites.includes(zh)}
function toggleFav(zh,e){e.stopPropagation();if(isFav(zh)){favorites=favorites.filter(f=>f!==zh)}else{favorites.push(zh)}saveFavs();render()}
function speakWord(zh,e){e.stopPropagation();if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(zh);u.lang="zh-TW";u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u)}}

async function fetchImg(kw){
  if(imgCache[kw]!==undefined)return imgCache[kw];
  imgCache[kw]=null;
  try{
    const r=await fetch(`https://api.unsplash.com/search/photos?query=${encodeURIComponent(kw)}&per_page=1&orientation=squarish&client_id=${UNSPLASH_KEY}`);
    const d=await r.json();
    if(d.results&&d.results[0])imgCache[kw]=d.results[0].urls.small;
  }catch(e){}
  return imgCache[kw];
}

function buildCard(item){
  const fav=isFav(item.zh);
  const imgId="img_"+Math.random().toString(36).slice(2,8);
  const card=document.createElement("div");
  card.className="vcard"+(fav?" favorited":"");
  card.innerHTML=`
    <div class="vcard-img" id="${imgId}" style="font-size:2.5rem;display:flex;align-items:center;justify-content:center;">${item.em}</div>
    <div class="vcard-body">
      <div class="vcard-zh">${item.zh}</div>
      <div class="vcard-pinyin">${item.py}</div>
      <div class="vcard-en">${item.en}</div>
    </div>
    <div class="vcard-actions">
      <button class="icon-btn" onclick="speakWord('${item.zh.replace(/'/g,"\\'")}',event)" title="Speak">🔊</button>
      <button class="icon-btn${fav?" fav-on":""}" onclick="toggleFav('${item.zh.replace(/'/g,"\\'")}',event)">${fav?"⭐":"☆"}</button>
    </div>`;
  fetchImg(item.kw).then(url=>{
    if(!url)return;
    const el=document.getElementById(imgId);
    if(!el)return;
    el.innerHTML=`<img src="${url}" alt="${item.en}" loading="lazy" style="width:100%;height:100%;object-fit:cover;"/>`;
  });
  return card;
}

function render(){
  const section=document.getElementById("cards-section");
  section.innerHTML="";
  let items=allItems;
  if(mode==="favorites"){
    items=allItems.filter(i=>isFav(i.zh));
    if(!items.length){section.innerHTML=`<div class="empty-state"><div class="big">⭐</div><p>No favorites yet. Tap ☆ on any card.</p></div>`;return;}
  }
  if(searchQuery){
    const q=searchQuery.toLowerCase();
    items=items.filter(i=>i.zh.includes(q)||i.py.toLowerCase().includes(q)||i.en.toLowerCase().includes(q)||i.cat.toLowerCase().includes(q));
    document.getElementById("search-stats").textContent=`${items.length} result${items.length!==1?"s":""}`;
  }else{document.getElementById("search-stats").textContent="";}
  if(searchQuery){
    const grid=document.createElement("div");grid.className="cards-grid";
    items.forEach(item=>grid.appendChild(buildCard(item)));section.appendChild(grid);
  }else if(currentCat==="ALL"){
    const cats=[...new Set(items.map(i=>i.cat))];
    cats.forEach(cat=>{
      const catItems=items.filter(i=>i.cat===cat);
      const block=document.createElement("div");block.className="cat-block";
      const title=document.createElement("div");title.className="cat-title";title.textContent=cat;
      block.appendChild(title);
      const grid=document.createElement("div");grid.className="cards-grid";
      catItems.forEach(item=>grid.appendChild(buildCard(item)));
      block.appendChild(grid);section.appendChild(block);
    });
  }else{
    const catItems=items.filter(i=>i.cat===currentCat);
    const block=document.createElement("div");block.className="cat-block";
    const title=document.createElement("div");title.className="cat-title";title.textContent=currentCat;
    block.appendChild(title);
    const grid=document.createElement("div");grid.className="cards-grid";
    catItems.forEach(item=>grid.appendChild(buildCard(item)));
    block.appendChild(grid);section.appendChild(block);
  }
}

function buildCatStrip(){
  const strip=document.getElementById("cat-strip");strip.innerHTML="";
  const all=document.createElement("button");all.className="cat-pill"+(currentCat==="ALL"?" active":"");all.textContent="All";
  all.onclick=()=>{currentCat="ALL";buildCatStrip();render()};strip.appendChild(all);
  Object.keys(DATA).forEach(cat=>{
    const btn=document.createElement("button");btn.className="cat-pill"+(currentCat===cat?" active":"");btn.textContent=cat;
    btn.onclick=()=>{currentCat=cat;buildCatStrip();render()};strip.appendChild(btn);
  });
}

function setMode(m){
  mode=m;document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("btn-"+m)?.classList.add("active");render();
}

function handleSearch(val){searchQuery=val.trim();currentCat="ALL";buildCatStrip();render();}

let quiz={items:[],idx:0,score:0,chosen:false};
function startQuiz(){
  const pool=(currentCat==="ALL"?allItems:allItems.filter(i=>i.cat===currentCat));
  quiz.items=pool.sort(()=>Math.random()-0.5).slice(0,Math.min(20,pool.length));
  quiz.idx=0;quiz.score=0;quiz.chosen=false;showQuiz();
}
function showQuiz(){
  const overlay=document.getElementById("quiz");
  overlay.style.display="flex";overlay.style.flexDirection="column";overlay.style.alignItems="center";overlay.style.justifyContent="center";
  if(quiz.idx>=quiz.items.length){
    overlay.innerHTML=`<div class="quiz-result"><h2>${quiz.score}/${quiz.items.length}</h2><p>${quiz.score>=quiz.items.length*0.8?"🎉 Excellent! 太棒了！":quiz.score>=quiz.items.length*0.5?"👍 Good work! 加油！":"📚 Keep practising! 繼續學習！"}</p><button class="quiz-restart" onclick="startQuiz()">Play Again</button><br><br><button style="background:transparent;border:1.5px solid rgba(250,248,244,0.3);color:#faf8f4;padding:0.3rem 0.75rem;border-radius:14px;cursor:pointer;font-family:inherit;margin-top:0.5rem;" onclick="document.getElementById('quiz').style.display='none'">Close</button></div>`;return;
  }
  const item=quiz.items[quiz.idx];
  const wrong=allItems.filter(i=>i.zh!==item.zh).sort(()=>Math.random()-0.5).slice(0,3);
  const opts=[item,...wrong].sort(()=>Math.random()-0.5);
  overlay.innerHTML=`
    <div class="quiz-header">
      <button class="quiz-close" onclick="document.getElementById('quiz').style.display='none'">✕ Close</button>
      <span class="quiz-progress">${quiz.idx+1} / ${quiz.items.length}</span>
      <span class="quiz-score">⭐ ${quiz.score}</span>
    </div>
    <div class="quiz-card">
      <div class="quiz-img" id="qimg">${item.em}</div>
      <div class="quiz-body">
        <div class="quiz-question">Traditional Chinese for:</div>
        <div style="font-size:1.1rem;font-weight:700;color:#2c2c2a;">"${item.en}"</div>
        <div class="quiz-options">
          ${opts.map(o=>`<button class="quiz-opt" onclick="checkAnswer('${o.zh.replace(/'/g,"\\'")}','${item.zh.replace(/'/g,"\\'")}',this)"><span class="opt-zh">${o.zh}</span><span class="opt-en">${o.py}</span></button>`).join("")}
        </div>
        <button class="quiz-next" id="quiz-next" onclick="nextQuiz()">Next →</button>
      </div>
    </div>`;
  fetchImg(item.kw).then(url=>{if(!url)return;const el=document.getElementById("qimg");if(el)el.innerHTML=`<img src="${url}" alt="${item.en}" style="width:100%;height:100%;object-fit:cover;"/>`;});
}
function checkAnswer(chosen,correct,btn){
  if(quiz.chosen)return;quiz.chosen=true;
  document.querySelectorAll(".quiz-opt").forEach(b=>{b.disabled=true;const zh=b.querySelector(".opt-zh")?.textContent;if(zh===correct)b.classList.add("correct");else if(zh===chosen&&chosen!==correct)b.classList.add("wrong");});
  if(chosen===correct)quiz.score++;
  document.getElementById("quiz-next").classList.add("visible");
}
function nextQuiz(){quiz.idx++;quiz.chosen=false;showQuiz();}

buildCatStrip();render();
</script>
